<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京移动宽带业务数据看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ff9800 0%, #f56c6c 100%);
            color: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(245, 108, 108, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header .update-time {
            font-size: 13px;
            opacity: 0.85;
        }

        /* ===== 指标卡片 ===== */
        .cards-section {
            margin-bottom: 20px;
        }

        .metric-card {
            background: #fff;
            border-radius: 10px;
            padding: 8px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .metric-card .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            order: 1;
            align-self: stretch;
        }

        .metric-card .value {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
            order: 2;
            letter-spacing: 0.5px;
        }

        .metric-card .sub {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
            order: 3;
        }

        .metric-card.total .value { color: #667eea; }
        .metric-card.public .value { color: #e85d6a; }
        .metric-card.private .value { color: #3ba272; }
        .metric-card.yearly .value { color: #9c27b0; }

        .section-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .cards-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        /* 年累计：紫色左边框（第一行，含业务类型） */
        .metric-card.yearly {
            border-left: 3px solid #9c27b0;
        }
        .metric-card.yearly .value { color: #9c27b0; }
        .metric-card.yearly .label::before {
            content: "年累计 · ";
            font-size: 12px;
            color: #9c27b0;
            font-weight: 600;
        }

        /* 当月总量（整体/公域/私域）：蓝色左边框 */
        .metric-card.current {
            border-left: 3px solid #667eea;
        }
        .metric-card.current .value { color: #667eea; }
        .metric-card.current .label::before {
            content: "当月 · ";
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
        }

        /* 业务类型卡片（当月）：橙色主题 */
        .metric-card.biz:not(.yearly) {
            border-left: 3px solid #ff9800;
        }
        .metric-card.biz:not(.yearly) .value { color: #ff7043; }
        .metric-card.biz:not(.yearly) .label::before {
            content: "业务 · ";
            font-size: 12px;
            color: #ff9800;
            font-weight: 600;
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .month-selector select {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .month-selector select option {
            color: #333;
        }

        .month-selector label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* ===== 图表区域 ===== */
        .chart-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .charts-row.three-col {
            grid-template-columns: repeat(3, 1fr);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .chart-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .chart-controls select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            background: #fff;
        }

        .chart-controls select:focus {
            border-color: #ff9800;
        }

        .checkbox-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            user-select: none;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #ff9800;
        }

        .chart-container {
            width: 100%;
            height: 240px;
        }

        /* ===== TOP5 产品表格 ===== */
        .top-product-table-wrap {
            overflow-x: auto;
        }

        .top-product-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .top-product-table thead th {
            background: #f5f6fa;
            color: #555;
            font-weight: 600;
            padding: 10px 12px;
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
        }

        .top-product-table thead th:first-child {
            text-align: left;
        }

        .top-product-table tbody td {
            padding: 8px 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .top-product-table tbody td:first-child {
            text-align: left;
        }

        .top-product-table tbody tr:hover {
            background: #f9f9fc;
        }

        .top-product-table .rank {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-right: 6px;
        }

        .top-product-table .rank-1 { background: #e85d6a; }
        .top-product-table .rank-2 { background: #fac858; }
        .top-product-table .rank-3 { background: #3ba272; }
        .top-product-table .rank-4 { background: #667eea; }
        .top-product-table .rank-5 { background: #9c27b0; }

        .top-product-table .product-name {
            display: inline-block;
            vertical-align: middle;
            text-align: left;
            max-width: 280px;
        }

        .top-product-table .no-data {
            color: #ccc;
            text-align: center;
            padding: 20px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .cards-row {
                grid-template-columns: repeat(3, 1fr);
            }
            .charts-row.three-col {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .cards-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-row {
                grid-template-columns: 1fr;
            }
            .charts-row.three-col {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<!-- ===== 订单量概览卡片（两行六列：年累计 / 当月 × 整体·公域·私域·新装·续费·提速） ===== -->

</div>

<div class="cards-section">

            <div class="value" id="cardBizUp">0</div>
            <div class="sub" id="cardBizUpSub"></div>

</div>

<!-- ===== 每月趋势 + 每日趋势 ===== -->
<div class="charts-row">
    <div class="chart-section">
        <div class="chart-header">
            <div class="chart-title">每月订单量趋势（按年对比）</div>
            <div class="checkbox-group" id="monthlyCheckboxGroup">

</div>

};

const BIZ_TYPES = DASHBOARD_DATA.biz_types;  // ["宽带新装","宽带续费","宽带提速"]

// ===== 工具函数 =====
function formatNumber(n) {
    return n.toLocaleString('zh-CN');
}

function getDomainColor(domain) {
    return COLORS[domain] || '#999';
}

function bizKey(name) {
    return name === '宽带新装' ? 'New' : name === '宽带续费' ? 'Renew' : 'Up';
}

function colorSpan(text, val) {
    return `<span style="color:${fmtColor(val)};font-weight:600;">${text}</span>`;
}

function fmtPct(val, prefix) {
    if (val === null) return '—';
    const sign = val >= 0 ? '+' : '';
    return `${prefix}${sign}${val.toFixed(1)}%`;
}

function fmtColor(val) {
    if (val === null) return '#aaa';
    return val >= 0 ? '#e85d6a' : '#3ba272'; // 涨红跌绿
}

function getMonthData(m) {
    return DASHBOARD_DATA.monthly_data.find(d => d.month === m);
}

function getBiz(m) {
    return DASHBOARD_DATA.biz_monthly[m];
}

function getPrevMonth(month) {
    const [y, mo] = month.split('-').map(Number);
    let py = y, pm = mo - 1;
    if (pm < 1) { pm = 12; py--; }
    return `${py}-${String(pm).padStart(2, '0')}`;
}

function getLastYearMonth(month) {
    const [y, mo] = month.split('-').map(Number);
    return `${y - 1}-${String(mo).padStart(2, '0')}`;
}

// ===== 环比（日对齐，基于 daily，域维度） =====
function calcMoM(month) {
    const cur = DASHBOARD_DATA.daily_data[month];
    if (!cur || !cur.days || cur.days.length === 0) return { total: null, '公域': null, '私域': null };
    const dayCount = cur.days.length;
    const curSum = {};
    for (const d of ['total', '公域', '私域']) curSum[d] = cur[d].reduce((a, b) => a + b, 0);
    const prev = getPrevMonth(month);
    const prevD = DASHBOARD_DATA.daily_data[prev];
    const res = {};
    for (const d of ['total', '公域', '私域']) {
        if (!prevD || !prevD.days || prevD.days.length === 0) { res[d] = null; continue; }
        const n = Math.min(dayCount, prevD.days.length);
        let s = 0;
        for (let i = 0; i < n; i++) s += prevD[d][i];
        res[d] = s > 0 ? ((curSum[d] - s) / s) * 100 : null;
    }
    return res;
}

// ===== 年累计同比（日对齐） =====
function calcYoYYearly(month) {
    const [y, mo] = month.split('-').map(Number);
    const cur = DASHBOARD_DATA.daily_data[month];
    if (!cur || !cur.days || cur.days.length === 0) return { total: null, '公域': null, '私域': null };
    const asOf = cur.days.length;
    const thisSum = {}, lastSum = {};
    for (const d of ['total', '公域', '私域']) { thisSum[d] = 0; lastSum[d] = 0; }
    for (let mm = 1; mm <= mo; mm++) {
        const mk = `${y}-${String(mm).padStart(2, '0')}`;
        const dd = DASHBOARD_DATA.daily_data[mk];
        if (!dd || !dd.days || dd.days.length === 0) continue;
        const lim = (mm === mo) ? asOf : dd.days.length;
        for (const d of ['total', '公域', '私域']) for (let i = 0; i < lim && i < dd.days.length; i++) thisSum[d] += dd[d][i];
    }
    const ly = y - 1;
    for (let mm = 1; mm <= mo; mm++) {
        const mk = `${ly}-${String(mm).padStart(2, '0')}`;
        const dd = DASHBOARD_DATA.daily_data[mk];
        if (!dd || !dd.days || dd.days.length === 0) continue;
        const lim = (mm === mo) ? asOf : dd.days.length;
        for (const d of ['total', '公域', '私域']) for (let i = 0; i < lim && i < dd.days.length; i++) lastSum[d] += dd[d][i];
    }
    const res = {};
    for (const d of ['total', '公域', '私域']) res[d] = lastSum[d] > 0 ? ((thisSum[d] - lastSum[d]) / lastSum[d]) * 100 : null;
    return res;
}

            const n = Math.min(dayCount, lastD.days.length);
            for (let i = 0; i < n; i++) lastSum[d] += lastD[d][i];

    }
    const res = {};
    for (const d of ['total', '公域', '私域']) res[d] = lastSum[d] > 0 ? ((curSum[d] - lastSum[d]) / lastSum[d]) * 100 : null;
    return res;
}

// ===== 业务类型环比/同比（月度整月对比） =====
function calcBizMoM(biz, month) {
    const cur = getBiz(month) ? getBiz(month)[biz] : 0;
    const prev = getBiz(getPrevMonth(month));
    const pv = prev ? prev[biz] : 0;
    return pv > 0 ? ((cur - pv) / pv) * 100 : null;
}

function calcBizYoY(biz, month) {
    const cur = getBiz(month) ? getBiz(month)[biz] : 0;
    const ly = getBiz(getLastYearMonth(month));
    const lv = ly ? ly[biz] : 0;
    return lv > 0 ? ((cur - lv) / lv) * 100 : null;
}

// ===== 年累计业务类型（按所选月份当年 1月~所选月 累加） =====
function getYearlyBiz(month) {
    const [curYear] = month.split('-');
    const sum = { '宽带新装': 0, '宽带续费': 0, '宽带提速': 0 };
    for (const d of DASHBOARD_DATA.monthly_data) {
        if (d.month.startsWith(curYear + '-') && d.month <= month) {
            const b = DASHBOARD_DATA.biz_monthly[d.month] || {};
            sum['宽带新装'] += b['宽带新装'] || 0;
            sum['宽带续费'] += b['宽带续费'] || 0;
            sum['宽带提速'] += b['宽带提速'] || 0;
        }
    }
    return sum;
}

// ===== 年累计业务类型同比（当年 1月~所选月 对比 去年同期） =====
function calcBizYoYYearly(biz, month) {
    const [curYear, curMo] = month.split('-').map(Number);
    let cur = 0, last = 0;
    for (let mm = 1; mm <= curMo; mm++) {
        const mk = `${curYear}-${String(mm).padStart(2, '0')}`;
        cur += (DASHBOARD_DATA.biz_monthly[mk] || {})[biz] || 0;
        const lyMk = `${curYear - 1}-${String(mm).padStart(2, '0')}`;
        last += (DASHBOARD_DATA.biz_monthly[lyMk] || {})[biz] || 0;
    }
    return last > 0 ? ((cur - last) / last) * 100 : null;
}

// ===== 场景1: 指标卡片 =====
function updateCards() {
    const month = document.getElementById('cardMonthSelect').value;
    const monthData = getMonthData(month);
    if (!monthData) return;

    // 当月数据
    document.getElementById('cardTotal').textContent = formatNumber(monthData.total);
    document.getElementById('cardPublic').textContent = formatNumber(monthData['公域']);
    document.getElementById('cardPrivate').textContent = formatNumber(monthData['私域']);

    const pubPct = monthData.total > 0 ? (monthData['公域'] / monthData.total * 100).toFixed(1) : 0;
    const priPct = monthData.total > 0 ? (monthData['私域'] / monthData.total * 100).toFixed(1) : 0;

    const momData = calcMoM(month);
    const yoyMonthData = calcYoYMonth(month);

    document.getElementById('cardTotalSub').innerHTML = `占比 ${pubPct}% · ${colorSpan(fmtPct(momData.total, '环比'), momData.total)} · ${colorSpan(fmtPct(yoyMonthData.total, '同比'), yoyMonthData.total)}`;
    document.getElementById('cardPublicSub').innerHTML = `占比 ${pubPct}% · ${colorSpan(fmtPct(momData['公域'], '环比'), momData['公域'])} · ${colorSpan(fmtPct(yoyMonthData['公域'], '同比'), yoyMonthData['公域'])}`;
    document.getElementById('cardPrivateSub').innerHTML = `占比 ${priPct}% · ${colorSpan(fmtPct(momData['私域'], '环比'), momData['私域'])} · ${colorSpan(fmtPct(yoyMonthData['私域'], '同比'), yoyMonthData['私域'])}`;

    // 年累计（仅同年份月份）
    const [curYear] = month.split('-');
    let yearlyTotal = 0, yearlyPublic = 0, yearlyPrivate = 0;
    for (const d of DASHBOARD_DATA.monthly_data) {
        if (d.month.startsWith(curYear + '-') && d.month <= month) {
            yearlyTotal += d.total;
            yearlyPublic += d['公域'];
            yearlyPrivate += d['私域'];
        }
    }

    document.getElementById('cardYearlyTotal').textContent = formatNumber(yearlyTotal);
    document.getElementById('cardYearlyPublic').textContent = formatNumber(yearlyPublic);
    document.getElementById('cardYearlyPrivate').textContent = formatNumber(yearlyPrivate);

    const yPubPct = yearlyTotal > 0 ? (yearlyPublic / yearlyTotal * 100).toFixed(1) : 0;
    const yPriPct = yearlyTotal > 0 ? (yearlyPrivate / yearlyTotal * 100).toFixed(1) : 0;

    const yoyYearlyData = calcYoYYearly(month);
    document.getElementById('cardYearlyTotalSub').innerHTML = `累计至 ${month} · ${colorSpan(fmtPct(yoyYearlyData.total, '同比'), yoyYearlyData.total)}`;
    document.getElementById('cardYearlyPublicSub').innerHTML = `占比 ${yPubPct}% · ${colorSpan(fmtPct(yoyYearlyData['公域'], '同比'), yoyYearlyData['公域'])}`;
    document.getElementById('cardYearlyPrivateSub').innerHTML = `占比 ${yPriPct}% · ${colorSpan(fmtPct(yoyYearlyData['私域'], '同比'), yoyYearlyData['私域'])}`;

    // 业务类型年累计卡片（第一行）
    const yearlyBiz = getYearlyBiz(month);
    for (const b of BIZ_TYPES) {
        const key = bizKey(b);
        const val = yearlyBiz[b] || 0;
        const pct = yearlyTotal > 0 ? (val / yearlyTotal * 100).toFixed(1) : 0;
        const yoyB = calcBizYoYYearly(b, month);
        document.getElementById('cardYearlyBiz' + key).textContent = formatNumber(val);
        document.getElementById('cardYearlyBiz' + key + 'Sub').innerHTML = `占比 ${pct}% · ${colorSpan(fmtPct(yoyB, '同比'), yoyB)}`;
    }

    // 业务类型卡片（当月）
    const biz = getBiz(month) || {};
    for (const b of BIZ_TYPES) {
        const key = bizKey(b);
        const val = biz[b] || 0;
        const pct = monthData.total > 0 ? (val / monthData.total * 100).toFixed(1) : 0;
        const momB = calcBizMoM(b, month);
        const yoyB = calcBizYoY(b, month);
        document.getElementById('cardBiz' + key).textContent = formatNumber(val);
        document.getElementById('cardBiz' + key + 'Sub').innerHTML = `占比 ${pct}% · ${colorSpan(fmtPct(momB, '环比'), momB)} · ${colorSpan(fmtPct(yoyB, '同比'), yoyB)}`;
    }
}

// ===== 场景2: 每月订单量趋势（按年对比，分组柱状图） =====
function updateMonthlyChart() {
    const checked = Array.from(document.querySelectorAll('#monthlyCheckboxGroup input:checked')).map(cb => cb.value);

    const yearMap = {};
    for (const d of DASHBOARD_DATA.monthly_data) {
        const [y, m] = d.month.split('-').map(Number);
        if (!yearMap[y]) yearMap[y] = {};
        yearMap[y][m] = d;
    }
    const years = Object.keys(yearMap).map(Number).sort();
    const latestYear = years[years.length - 1];

    const monthLabels = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);
    const series = [];
    const legendData = [];

    for (const domain of checked) {
        const baseColor = getDomainColor(domain);
        const label = domain === 'total' ? '整体' : domain;
        for (const year of years) {
            const isLatest = (year === latestYear);
            const data = [];
            for (let m = 1; m <= 12; m++) {
                const md = yearMap[year][m];
                data.push(md ? md[domain] : null);
            }
            const name = `${label} ${year}`;
            legendData.push(name);
            series.push({
                name,
                type: 'bar',
                data,
                barMaxWidth: 16,
                itemStyle: {
                    color: baseColor,
                    opacity: isLatest ? 1 : 0.35,
                },
            });
        }
    }

    const option = {
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: function(params) {
                let html = params[0].name + '<br/>';
                params.forEach(p => {
                    if (p.value !== null && p.value !== undefined) {
                        html += `${p.marker} ${p.seriesName}: <b>${formatNumber(p.value)}</b><br/>`;
                    }
                });
                return html;
            }
        },
        legend: { data: legendData, top: 0, type: 'scroll' },
        grid: { left: 60, right: 30, top: 50, bottom: 50 },
        xAxis: { type: 'category', data: monthLabels, axisLabel: { fontSize: 12 } },
        yAxis: { type: 'value', name: '订单量', axisLabel: { formatter: function(v) { return formatNumber(v); } } },
        series: series,
        barGap: '10%',
        barCategoryGap: '35%',
        dataZoom: [
            { type: 'inside', start: 0, end: 100 },
            { type: 'slider', start: 0, end: 100, height: 20, bottom: 5 },
        ],
    };
    monthlyChart.setOption(option, true);
}

// ===== 场景3: 日订单量趋势 =====
function updateDailyChart() {
    const month = document.getElementById('cardMonthSelect').value;
    const checked = Array.from(document.querySelectorAll('#dailyCheckboxGroup input:checked')).map(cb => cb.value);
    const dailyData = DASHBOARD_DATA.daily_data[month];
    if (!dailyData) return;

    const days = dailyData.days;
    const xLabels = days.map(d => d + '日');

    const series = checked.map(domain => ({
        name: domain === 'total' ? '整体' : domain,
        type: 'line',
        data: dailyData[domain],
        smooth: true,
        symbol: 'circle',
        symbolSize: 5,
        itemStyle: { color: getDomainColor(domain) },
        lineStyle: { width: 2 },
        areaStyle: checked.length === 1 ? { opacity: 0.15 } : undefined,
    }));

    const option = {
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                let html = `${month.replace('-', '年')}月 ${params[0].name}<br/>`;
                params.forEach(p => {
                    html += `${p.marker} ${p.seriesName}: <b>${formatNumber(p.value)}</b><br/>`;
                });
                return html;
            }
        },
        legend: { data: checked.map(d => d === 'total' ? '整体' : d), top: 0, right: 0 },
        grid: { left: 60, right: 30, top: 40, bottom: 50 },
        xAxis: { type: 'category', data: xLabels, axisLabel: { fontSize: 11 }, boundaryGap: false },
        yAxis: { type: 'value', name: '订单量', axisLabel: { formatter: function(v) { return formatNumber(v); } } },
        series: series,
        dataZoom: [
            { type: 'inside', start: 0, end: 100 },
            { type: 'slider', start: 0, end: 100, height: 20, bottom: 8 },
        ],
    };
    dailyChart.setOption(option, true);
}

// ===== 场景5&6: TOP5 / TOP3 产品表格 =====
function renderTopTable(containerId, list) {
    const el = document.getElementById(containerId);
    if (!list || list.length === 0) {
        el.innerHTML = '<div class="no-data">暂无数据</div>';
        return;
    }
    let html = '<table class="top-product-table"><thead><tr><th>排名</th><th>产品名称</th><th>单量</th></tr></thead><tbody>';
    list.forEach((item, i) => {
        html += `<tr><td><span class="rank rank-${i + 1}">${i + 1}</span></td><td class="product-name">${item.name}</td><td>${formatNumber(item.value)}</td></tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
}

function updateTopProducts() {
    const month = document.getElementById('cardMonthSelect').value;
    renderTopTable('publicTop5Table', DASHBOARD_DATA.public_top5[month] || []);
    renderTopTable('privateTop5Table', DASHBOARD_DATA.private_top5[month] || []);
    const bz = DASHBOARD_DATA.biz_top3[month] || {};
    renderTopTable('bizNewTop3Table', bz['宽带新装'] || []);
    renderTopTable('bizRenewTop3Table', bz['宽带续费'] || []);
    renderTopTable('bizUpTop3Table', bz['宽带提速'] || []);
}

// ===== 初始化 =====
function init() {
    monthlyChart = echarts.init(document.getElementById('monthlyChart'));
    dailyChart = echarts.init(document.getElementById('dailyChart'));

    const months = DASHBOARD_DATA.months;
    document.getElementById('cardMonthSelect').innerHTML = months.map(m => {
        const label = m.replace('-', '年') + '月';
        return `<option value="${m}">${label}</option>`;
    }).join('');
    document.getElementById('cardMonthSelect').value = DASHBOARD_DATA.current_month;
    document.getElementById('updateTime').textContent = `数据更新于 ${DASHBOARD_DATA.generated_at}`;

    document.getElementById('cardMonthSelect').addEventListener('change', function() {
        updateCards();
        updateDailyChart();
        updateTopProducts();
    });

    document.querySelectorAll('#monthlyCheckboxGroup input').forEach(cb => {
        cb.addEventListener('change', updateMonthlyChart);
    });
    document.querySelectorAll('#dailyCheckboxGroup input').forEach(cb => {
        cb.addEventListener('change', updateDailyChart);
    });

    window.addEventListener('resize', () => {
        monthlyChart.resize();
        dailyChart.resize();
    });

    updateCards();
    updateMonthlyChart();
    updateDailyChart();
    updateTopProducts();
}

document.addEventListener('DOMContentLoaded', init);
</script>
