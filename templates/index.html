<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流量套餐订单数据看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header .update-time {
            font-size: 13px;
            opacity: 0.85;
        }

        /* ===== 指标卡片 ===== */
        .cards-section {
            margin-bottom: 20px;
        }

        .metric-card {
            background: #fff;
            border-radius: 10px;
            padding: 8px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .metric-card .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            order: 1;
            align-self: stretch;
        }

        .metric-card .value {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
            order: 2;
            letter-spacing: 0.5px;
        }

        .metric-card .sub {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
            order: 3;
        }

        .metric-card.total .value { color: #667eea; }
        .metric-card.public .value { color: #e85d6a; }
        .metric-card.private .value { color: #3ba272; }
        .metric-card.external .value { color: #fac858; }
        .metric-card.yearly .value { color: #9c27b0; }

        .cards-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .cards-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .metric-card.yearly {
            border-left: 3px solid #9c27b0;
        }

        .metric-card:not(.yearly) {
            border-left: 3px solid #667eea;
        }

        .metric-card.yearly .label::before {
            content: "年累计 · ";
            font-size: 12px;
            color: #9c27b0;
            font-weight: 600;
        }

        .metric-card:not(.yearly) .label::before {
            content: "当月 · ";
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .month-selector select {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .month-selector select option {
            color: #333;
        }

        .month-selector label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* ===== 图表区域 ===== */
        .chart-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .charts-row {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 图表与数据表并排 */
        .chart-table-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .trend-chart {
            flex: 1 1 auto;
            min-width: 0;
            height: 320px;
        }

        .trend-table-wrap {
            flex: 0 0 400px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;

            color: #555;
            font-weight: 600;

        .trend-data-table tbody td {
            padding: 6px 6px;
            border-bottom: 1px solid #f2f2f2;
            text-align: right;
            white-space: nowrap;
            color: #444;
        }

            font-weight: 500;

        }

        .pct-cell {

            line-height: 1.5;

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .chart-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .chart-controls select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            background: #fff;
        }

        .chart-controls select:focus {
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;

            align-items: center;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            user-select: none;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #667eea;
        }

        .chart-container {
            width: 100%;
            height: 190px;
        }

        .chart-container.tall {
            height: 225px;
        }

        /* ===== TOP5 产品表格 ===== */
        .top-product-table-wrap {

            text-align: center;

            white-space: nowrap;
        }

        .top-product-table thead th:first-child {

            padding: 8px 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .top-product-table tbody td:first-child {
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        .top-product-table tbody tr:hover {
            background: #f9f9fc;

        .top-product-table .rank {
            display: inline-block;
            width: 20px;

            border-radius: 50%;

            text-align: center;

        .top-product-table .rank-3 { background: #3ba272; }
        .top-product-table .rank-4 { background: #667eea; }
        .top-product-table .rank-5 { background: #9c27b0; }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {

            }

            }
            .chart-table-row {

            }
            .trend-table-wrap {
                flex: 1 1 auto;
                max-height: none;
            }
            .header {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<script>
// ===== 数据会被嵌入这里 =====
// ${DATA_PLACEHOLDER}

// ===== 图表实例 =====
let monthlyChart, dailyChart, channelChart;

// ===== 颜色配置 =====
const COLORS = {
    total: '#667eea',
    '公域': '#e85d6a',
    '私域': '#3ba272',
    '外部渠道': '#fac858'
};

// ===== 工具函数 =====
function formatNumber(n) {
    return n.toLocaleString('zh-CN');
}

function getDomainColor(domain) {
    return COLORS[domain] || '#999';
}

// ===== 环比计算：当月截至最后一天 vs 上月同期(1日~同一天数) =====
function calcMoM(month) {
    const curDaily = DASHBOARD_DATA.daily_data[month];
    if (!curDaily || !curDaily.days || curDaily.days.length === 0) {
        return { total: null, '公域': null, '私域': null, '外部渠道': null };
    }

    // 当月截至最后一天的天数
    const dayCount = curDaily.days.length;
    const domains = ['total', '公域', '私域', '外部渠道'];

    // 当月累计（截至最后一天）
    const curSum = {};
    for (const d of domains) {
        curSum[d] = curDaily[d].reduce((a, b) => a + b, 0);
    }

    // 找上月 key
    const [year, mon] = month.split('-').map(Number);
    let prevYear = year, prevMon = mon - 1;
    if (prevMon < 1) { prevMon = 12; prevYear--; }
    const prevMonth = `${prevYear}-${String(prevMon).padStart(2, '0')}`;
    const prevDaily = DASHBOARD_DATA.daily_data[prevMonth];

    const result = {};
    for (const d of domains) {
        if (!prevDaily || !prevDaily.days || prevDaily.days.length === 0) {
            result[d] = null;
            continue;
        }
        // 上月同期：取前 dayCount 天
        const sliceLen = Math.min(dayCount, prevDaily.days.length);
        let prevSum = 0;
        for (let i = 0; i < sliceLen; i++) {
            prevSum += prevDaily[d][i];
        }
        if (prevSum === 0) {
            result[d] = null;
        } else {
            result[d] = ((curSum[d] - prevSum) / prevSum) * 100;
        }
    }
    return result;
}

// ===== 同比计算：当年截至今日 vs 去年截至同日（日对齐，按年累计） =====
function calcYoYYearly(month) {
    const [year, mon] = month.split('-').map(Number);
    const curDaily = DASHBOARD_DATA.daily_data[month];
    if (!curDaily || !curDaily.days || curDaily.days.length === 0) {
        return { total: null, '公域': null, '私域': null, '外部渠道': null };
    }
    const asOfDay = curDaily.days.length; // 当月已出数据的天数 = 截至日
    const domains = ['total', '公域', '私域', '外部渠道'];
    const thisSum = {}, lastSum = {};
    for (const d of domains) { thisSum[d] = 0; lastSum[d] = 0; }

    // 本年 1月 ~ 当前月（当前月只取截至日）
    for (let mm = 1; mm <= mon; mm++) {
        const mk = `${year}-${String(mm).padStart(2, '0')}`;
        const dd = DASHBOARD_DATA.daily_data[mk];
        if (!dd || !dd.days || dd.days.length === 0) continue;
        const limit = (mm === mon) ? asOfDay : dd.days.length;
        for (const d of domains) {
            for (let i = 0; i < limit && i < dd.days.length; i++) {
                thisSum[d] += dd[d][i];
            }
        }
    }
    // 去年 1月 ~ 同月（同月只取截至日，与今年对齐）
    const ly = year - 1;
    for (let mm = 1; mm <= mon; mm++) {
        const mk = `${ly}-${String(mm).padStart(2, '0')}`;
        const dd = DASHBOARD_DATA.daily_data[mk];
        if (!dd || !dd.days || dd.days.length === 0) continue;
        const limit = (mm === mon) ? asOfDay : dd.days.length;
        for (const d of domains) {
            for (let i = 0; i < limit && i < dd.days.length; i++) {
                lastSum[d] += dd[d][i];
            }
        }
    }
    const result = {};
    for (const d of domains) {
        result[d] = lastSum[d] > 0 ? ((thisSum[d] - lastSum[d]) / lastSum[d]) * 100 : null;
    }
    return result;
}

// ===== 同比计算：当月 vs 去年同月（日对齐） =====
function calcYoYMonth(month) {
    const [year, mon] = month.split('-').map(Number);
    const curDaily = DASHBOARD_DATA.daily_data[month];
    if (!curDaily || !curDaily.days || curDaily.days.length === 0) {
        return { total: null, '公域': null, '私域': null, '外部渠道': null };
    }
    const dayCount = curDaily.days.length;
    const ly = year - 1;
    const lastMonth = `${ly}-${String(mon).padStart(2, '0')}`;
    const lastDaily = DASHBOARD_DATA.daily_data[lastMonth];
    const domains = ['total', '公域', '私域', '外部渠道'];
    const curSum = {}, lastSum = {};
    for (const d of domains) {
        curSum[d] = curDaily[d].reduce((a, b) => a + b, 0);
        lastSum[d] = 0;
        if (lastDaily && lastDaily.days && lastDaily.days.length > 0) {
            const limit = Math.min(dayCount, lastDaily.days.length);
            for (let i = 0; i < limit; i++) lastSum[d] += lastDaily[d][i];
        }
    }
    const result = {};
    for (const d of domains) {
        result[d] = lastSum[d] > 0 ? ((curSum[d] - lastSum[d]) / lastSum[d]) * 100 : null;
    }
    return result;
}

// ===== 场景1: 指标卡片 =====
function updateCards() {
    const month = document.getElementById('cardMonthSelect').value;
    const monthData = DASHBOARD_DATA.monthly_data.find(d => d.month === month);
    if (!monthData) return;

    // 当月数据
    document.getElementById('cardTotal').textContent = formatNumber(monthData.total);
    document.getElementById('cardPublic').textContent = formatNumber(monthData['公域']);
    document.getElementById('cardPrivate').textContent = formatNumber(monthData['私域']);
    document.getElementById('cardExternal').textContent = formatNumber(monthData['外部渠道']);

    // 当月占比 & 环比上月同期
    const pubPct = monthData.total > 0 ? (monthData['公域'] / monthData.total * 100).toFixed(1) : 0;
    const priPct = monthData.total > 0 ? (monthData['私域'] / monthData.total * 100).toFixed(1) : 0;
    const extPct = monthData.total > 0 ? (monthData['外部渠道'] / monthData.total * 100).toFixed(1) : 0;

    // 计算环比：当月截至最后一天 vs 上月同期(1日~同一天数)
    const momData = calcMoM(month);
    // 计算同比：当月 vs 去年同月
    const yoyMonthData = calcYoYMonth(month);
    const fmtPct = function(val, prefix) {
        if (val === null) return '—';
        const sign = val >= 0 ? '+' : '';
        return `${prefix}${sign}${val.toFixed(1)}%`;
    };
    const fmtColor = function(val) {
        if (val === null) return '#aaa';
        return val >= 0 ? '#e85d6a' : '#3ba272'; // 涨红跌绿
    };

    // 当月卡片：占比 · 环比 · 同比
    document.getElementById('cardTotalSub').innerHTML = `占比 ${pubPct}% · <span style="color:${fmtColor(momData.total)};font-weight:600;">${fmtPct(momData.total, '环比')}</span> · <span style="color:${fmtColor(yoyMonthData.total)};font-weight:600;">${fmtPct(yoyMonthData.total, '同比')}</span>`;
    document.getElementById('cardPublicSub').innerHTML = `占比 ${pubPct}% · <span style="color:${fmtColor(momData['公域'])};font-weight:600;">${fmtPct(momData['公域'], '环比')}</span> · <span style="color:${fmtColor(yoyMonthData['公域'])};font-weight:600;">${fmtPct(yoyMonthData['公域'], '同比')}</span>`;
    document.getElementById('cardPrivateSub').innerHTML = `占比 ${priPct}% · <span style="color:${fmtColor(momData['私域'])};font-weight:600;">${fmtPct(momData['私域'], '环比')}</span> · <span style="color:${fmtColor(yoyMonthData['私域'])};font-weight:600;">${fmtPct(yoyMonthData['私域'], '同比')}</span>`;
    document.getElementById('cardExternalSub').innerHTML = `占比 ${extPct}% · <span style="color:${fmtColor(momData['外部渠道'])};font-weight:600;">${fmtPct(momData['外部渠道'], '环比')}</span> · <span style="color:${fmtColor(yoyMonthData['外部渠道'])};font-weight:600;">${fmtPct(yoyMonthData['外部渠道'], '同比')}</span>`;

    // 年累计：仅累加同年份的月份（1月~所选月），避免跨年累加
    const [curYear] = month.split('-');
    let yearlyTotal = 0, yearlyPublic = 0, yearlyPrivate = 0, yearlyExternal = 0;
    for (const d of DASHBOARD_DATA.monthly_data) {
        if (d.month.startsWith(curYear + '-') && d.month <= month) {
            yearlyTotal += d.total;
            yearlyPublic += d['公域'];
            yearlyPrivate += d['私域'];
            yearlyExternal += d['外部渠道'];
        }
    }

    document.getElementById('cardYearlyTotal').textContent = formatNumber(yearlyTotal);
    document.getElementById('cardYearlyPublic').textContent = formatNumber(yearlyPublic);
    document.getElementById('cardYearlyPrivate').textContent = formatNumber(yearlyPrivate);
    document.getElementById('cardYearlyExternal').textContent = formatNumber(yearlyExternal);

    const yPubPct = yearlyTotal > 0 ? (yearlyPublic / yearlyTotal * 100).toFixed(1) : 0;
    const yPriPct = yearlyTotal > 0 ? (yearlyPrivate / yearlyTotal * 100).toFixed(1) : 0;
    const yExtPct = yearlyTotal > 0 ? (yearlyExternal / yearlyTotal * 100).toFixed(1) : 0;

    // 年累计同比：今年截至今日 vs 去年截至同日
    const yoyYearlyData = calcYoYYearly(month);
    document.getElementById('cardYearlyTotalSub').innerHTML = `累计至 ${month} · <span style="color:${fmtColor(yoyYearlyData.total)};font-weight:600;">${fmtPct(yoyYearlyData.total, '同比')}</span>`;
    document.getElementById('cardYearlyPublicSub').innerHTML = `占比 ${yPubPct}% · <span style="color:${fmtColor(yoyYearlyData['公域'])};font-weight:600;">${fmtPct(yoyYearlyData['公域'], '同比')}</span>`;
    document.getElementById('cardYearlyPrivateSub').innerHTML = `占比 ${yPriPct}% · <span style="color:${fmtColor(yoyYearlyData['私域'])};font-weight:600;">${fmtPct(yoyYearlyData['私域'], '同比')}</span>`;
    document.getElementById('cardYearlyExternalSub').innerHTML = `占比 ${yExtPct}% · <span style="color:${fmtColor(yoyYearlyData['外部渠道'])};font-weight:600;">${fmtPct(yoyYearlyData['外部渠道'], '同比')}</span>`;
}

// ===== 场景2: 每月订单量趋势（按年对比 · 分组柱状图） =====
function updateMonthlyChart() {
    const checked = Array.from(document.querySelectorAll('#monthlyCheckboxGroup input:checked')).map(cb => cb.value);

    // 按年份分组：yearMap[year][monthIndex] = 月度数据
    const yearMap = {};
    for (const d of DASHBOARD_DATA.monthly_data) {
        const [y, m] = d.month.split('-').map(Number);
        if (!yearMap[y]) yearMap[y] = {};
        yearMap[y][m] = d;
    }
    const years = Object.keys(yearMap).map(Number).sort();
    const latestYear = years[years.length - 1];

    const monthLabels = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);
    const series = [];
    const legendData = [];

    // 顺序：每个域的「今年 / 去年」相邻并排，同域同色、今年实色、去年浅色
    for (const domain of checked) {
        const baseColor = getDomainColor(domain);
        const label = domain === 'total' ? '整体' : domain;
        for (const year of years) {
            const isLatest = (year === latestYear);
            const data = [];
            for (let m = 1; m <= 12; m++) {
                const md = yearMap[year][m];
                data.push(md ? md[domain] : null);
            }
            const name = `${label} ${year}`;
            legendData.push(name);
            series.push({
                name,
                type: 'bar',
                data,
                barMaxWidth: 16,
                itemStyle: {
                    color: baseColor,
                    opacity: isLatest ? 1 : 0.35,   // 去年浅色，今年实色
                },
            });
        }
    }

    const option = {
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: function(params) {
                let html = params[0].name + '<br/>';
                params.forEach(p => {
                    if (p.value !== null && p.value !== undefined) {
                        html += `${p.marker} ${p.seriesName}: <b>${formatNumber(p.value)}</b><br/>`;
                    }
                });
                return html;
            }
        },
        legend: {
            data: legendData,
            top: 0,
            type: 'scroll',
        },
        grid: { left: 60, right: 30, top: 50, bottom: 50 },
        xAxis: {
            type: 'category',
            data: monthLabels,
            axisLabel: { fontSize: 12 },
        },
        yAxis: {
            type: 'value',
            name: '订单量',
            axisLabel: { formatter: function(v) { return formatNumber(v); } },
        },
        series: series,
        barGap: '10%',
        barCategoryGap: '35%',
        dataZoom: [
            { type: 'inside', start: 0, end: 100 },
            { type: 'slider', start: 0, end: 100, height: 20, bottom: 5 },
        ],
    };

    monthlyChart.setOption(option, true);
}

// ===== 场景3: 日订单量趋势 =====
function updateDailyChart() {
    const month = document.getElementById('cardMonthSelect').value;
    const checked = Array.from(document.querySelectorAll('#dailyCheckboxGroup input:checked')).map(cb => cb.value);
    const dailyData = DASHBOARD_DATA.daily_data[month];
    if (!dailyData) return;

    const days = dailyData.days;
    const xLabels = days.map(d => d + '日');

    const series = checked.map(domain => ({
        name: domain === 'total' ? '整体' : domain,
        type: 'line',
        data: dailyData[domain],
        smooth: true,
        symbol: 'circle',
        symbolSize: 5,
        itemStyle: { color: getDomainColor(domain) },
        lineStyle: { width: 2 },
        areaStyle: checked.length === 1 ? { opacity: 0.15 } : undefined,
    }));

    const option = {
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                let html = `${month.replace('-', '年')}月 ${params[0].name}<br/>`;
                params.forEach(p => {
                    html += `${p.marker} ${p.seriesName}: <b>${formatNumber(p.value)}</b><br/>`;
                });
                return html;
            }
        },
        legend: {
            data: checked.map(d => d === 'total' ? '整体' : d),
            top: 0,
            right: 0,
        },
        grid: { left: 60, right: 30, top: 40, bottom: 50 },
        xAxis: {
            type: 'category',
            data: xLabels,
            axisLabel: { fontSize: 11 },
            boundaryGap: false,
        },
        yAxis: {
            type: 'value',
            name: '订单量',
            axisLabel: { formatter: function(v) { return formatNumber(v); } },
        },
        series: series,
        dataZoom: [
            { type: 'inside', start: 0, end: 100 },
            { type: 'slider', start: 0, end: 100, height: 20, bottom: 8 },
        ],
    };

    dailyChart.setOption(option, true);
}

// ===== 场景2 表格: 每月订单量趋势数据表 =====
function renderMonthlyTable() {
    const tbody = document.getElementById('monthlyTableBody');
    let html = '';
    for (const d of DASHBOARD_DATA.monthly_data) {
        const total = d.total;
        const pPub = total ? (d['公域'] / total * 100) : 0;
        const pPri = total ? (d['私域'] / total * 100) : 0;
        const pExt = total ? (d['外部渠道'] / total * 100) : 0;
        const [y, m] = d.month.split('-');
        html += `<tr>
            <td>${y}年${Number(m)}月</td>
            <td>${formatNumber(d['公域'])}</td>
            <td>${formatNumber(d['私域'])}</td>
            <td>${formatNumber(d['外部渠道'])}</td>
            <td style="font-weight:600">${formatNumber(total)}</td>
            <td class="pct-cell">
                <span style="color:#5b8ff9">公${pPub.toFixed(1)}%</span>
                <span style="color:#5ad8a6">私${pPri.toFixed(1)}%</span>
                <span style="color:#f6bd16">外${pExt.toFixed(1)}%</span>
            </td>
        </tr>`;
    }
    tbody.innerHTML = html;
}

// ===== 场景3 表格: 日订单量趋势数据表 =====
function renderDailyTable() {
    const month = document.getElementById('cardMonthSelect').value;
    const dd = DASHBOARD_DATA.daily_data[month];
    const tbody = document.getElementById('dailyTableBody');
    if (!dd || dd.days.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="color:#ccc;text-align:center;padding:16px;">所选月份无日订单数据</td></tr>';
        return;
    }
    const [, mm] = month.split('-');
    let html = '';
    for (let i = 0; i < dd.days.length; i++) {
        const day = dd.days[i];
        const pub = dd['公域'][i];
        const pri = dd['私域'][i];
        const ext = dd['外部渠道'][i];
        const total = pub + pri + ext;
        const pPub = total ? (pub / total * 100) : 0;
        const pPri = total ? (pri / total * 100) : 0;
        const pExt = total ? (ext / total * 100) : 0;
        html += `<tr>
            <td>${Number(mm)}月${day}日</td>
            <td>${formatNumber(pub)}</td>
            <td>${formatNumber(pri)}</td>
            <td>${formatNumber(ext)}</td>
            <td style="font-weight:600">${formatNumber(total)}</td>
            <td class="pct-cell">
                <span style="color:#5b8ff9">公${pPub.toFixed(1)}%</span>
                <span style="color:#5ad8a6">私${pPri.toFixed(1)}%</span>
                <span style="color:#f6bd16">外${pExt.toFixed(1)}%</span>
            </td>
        </tr>`;
    }
    tbody.innerHTML = html;
}

// ===== 场景4: 投放点位月度订单量 =====
function updateChannelChart() {
    const month = document.getElementById('cardMonthSelect').value;
    const checked = Array.from(document.querySelectorAll('#channelCheckboxGroup input:checked')).map(cb => cb.value);
    const channelData = DASHBOARD_DATA.channel_data[month];
    if (!channelData) return;

    // 过滤掉 total=0 的点位，并按 total 降序排列
    const filtered = channelData.filter(d => d.total > 0).sort((a, b) => b.total - a.total);
    const channels = filtered.map(d => d.channel);

    const series = checked.map(domain => ({
        name: domain,
        type: 'bar',
        data: filtered.map(d => d[domain]),
        itemStyle: { color: getDomainColor(domain) },
        stack: 'channel',
    }));

    const option = {
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: function(params) {
                let html = `${month.replace('-', '年')}月<br/>`;
                html += `<b>${params[0].name}</b><br/>`;
                let total = 0;
                params.forEach(p => {
                    html += `${p.marker} ${p.seriesName}: <b>${formatNumber(p.value)}</b><br/>`;
                    total += p.value;
                });
                html += `合计: <b>${formatNumber(total)}</b>`;
                return html;
            }
        },
        legend: {
            data: checked,
            top: 0,
            right: 0,
        },
        grid: { left: 100, right: 30, top: 40, bottom: 40 },
        xAxis: {
            type: 'value',
            name: '订单量',
            axisLabel: { formatter: function(v) { return formatNumber(v); } },
        },
        yAxis: {
            type: 'category',
            data: channels,
            axisLabel: { fontSize: 12 },
            inverse: true,
        },
        series: series,
    };

    channelChart.setOption(option, true);
}

// ===== 场景5: 各投放点位 TOP5 产品（表格） =====
function updateTopProductTable() {
    const month = document.getElementById('cardMonthSelect').value;
    const monthData = DASHBOARD_DATA.channel_top_products[month] || {};
    const channels = DASHBOARD_DATA.channels.filter(ch => ch !== '未知');

    // 按各点位 total 降序排列
    const channelOrder = DASHBOARD_DATA.channel_data[month]
        ? DASHBOARD_DATA.channel_data[month]
            .filter(d => d.total > 0)
            .sort((a, b) => b.total - a.total)
            .map(d => d.channel)
        : channels;

    let html = '<table class="top-product-table"><thead><tr>';
    html += '<th>排名</th>';
    for (const ch of channelOrder) {
        html += `<th>${ch}</th>`;
    }
    html += '</tr></thead><tbody>';

    for (let rank = 0; rank < 5; rank++) {
        html += '<tr>';
        html += `<td><span class="rank rank-${rank + 1}">${rank + 1}</span></td>`;
        for (const ch of channelOrder) {
            const products = monthData[ch] || [];
            const item = products[rank];
            if (item) {
                html += `<td><span class="product-name">${item.name}</span><br><span style="color:#888;font-size:12px;">${formatNumber(item.value)} 单</span></td>`;
            } else {
                html += '<td class="no-data">—</td>';
            }
        }
        html += '</tr>';
    }

    html += '</tbody></table>';
    document.getElementById('topProductTable').innerHTML = html;
}

// ===== 初始化 =====
function init() {
    // 初始化图表
    monthlyChart = echarts.init(document.getElementById('monthlyChart'));
    dailyChart = echarts.init(document.getElementById('dailyChart'));
    channelChart = echarts.init(document.getElementById('channelChart'));

    // 填充月份选择器
    const months = DASHBOARD_DATA.months;
    const monthOptions = months.map(m => {
        const label = m.replace('-', '年') + '月';
        return `<option value="${m}">${label}</option>`;
    }).join('');

    document.getElementById('cardMonthSelect').innerHTML = monthOptions;

    // 默认选中最新月份
    const defaultMonth = DASHBOARD_DATA.current_month;
    document.getElementById('cardMonthSelect').value = defaultMonth;

    // 更新时间
    document.getElementById('updateTime').textContent = `数据更新于 ${DASHBOARD_DATA.generated_at}`;

    // 头部月份联动：切换时同步刷新所有月份相关模块
    document.getElementById('cardMonthSelect').addEventListener('change', function() {
        updateCards();
        updateDailyChart();
        updateChannelChart();
        updateTopProductTable();
        renderDailyTable();
    });

    document.querySelectorAll('#monthlyCheckboxGroup input').forEach(cb => {
        cb.addEventListener('change', updateMonthlyChart);
    });
    document.querySelectorAll('#dailyCheckboxGroup input').forEach(cb => {
        cb.addEventListener('change', updateDailyChart);
    });
    document.querySelectorAll('#channelCheckboxGroup input').forEach(cb => {
        cb.addEventListener('change', updateChannelChart);
    });

    // 窗口resize
    window.addEventListener('resize', () => {
        monthlyChart.resize();
        dailyChart.resize();
        channelChart.resize();
    });

    // 首次渲染
    updateCards();
    updateMonthlyChart();
    updateDailyChart();
    updateChannelChart();
    updateTopProductTable();
    renderMonthlyTable();
    renderDailyTable();
}

// 启动
document.addEventListener('DOMContentLoaded', init);
</script>
