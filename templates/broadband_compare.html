<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京移动宽带业务数据对比分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ff9800 0%, #f56c6c 100%);
            color: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(245, 108, 108, 0.3);
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header .update-time {
            font-size: 13px;
            opacity: 0.85;
        }

        /* ===== 控制面板 ===== */
        .control-panel {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .mode-toggle {
            display: flex;
            gap: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .mode-toggle button {
            padding: 8px 20px;
            border: none;
            background: #f5f6fa;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-toggle button.active {
            background: #ff9800;
            color: #fff;
        }

        .range-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            min-width: 60px;
        }

        .range-group select,
        .range-group input[type="date"] {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            background: #fff;
        }

        .range-group select:focus,
        .range-group input[type="date"]:focus {
            border-color: #ff9800;
        }

        .range-group .separator {
            color: #aaa;
            font-size: 13px;
        }

        .btn-compare {
            padding: 8px 24px;
            background: #ff9800;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-compare:hover {
            background: #f57c00;
        }

        .yoy-hint {
            color: #888;
            font-size: 12px;
            align-self: center;
        }

        .hidden {
            display: none !important;
        }

        /* ===== 汇总信息 ===== */
        .summary-bar {
            background: #fff;
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            font-size: 14px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-item .label {
            color: #888;
        }

        .summary-item .value {
            font-weight: 700;
            font-size: 18px;
        }

        .summary-item .value.up { color: #e85d6a; }
        .summary-item .value.down { color: #3ba272; }

        /* ===== 对比表格 ===== */
        .table-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        /* 模块折叠箭头 + 文字说明 */
        .collapse-arrow {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 10px;
            font-size: 12px;
            color: #999;
            flex-shrink: 0;
        }
        .collapse-arrow .arrow-icon {
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .table-section.collapsed .collapse-arrow .arrow-icon {
            transform: rotate(-90deg);
        }
        .table-section.collapsed > *:not(.table-title) {
            display: none !important;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .compare-table thead th {
            background: #f5f6fa;
            color: #555;
            font-weight: 600;
            padding: 12px 14px;
            text-align: right;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
        }

        .compare-table thead th:first-child {
            text-align: left;
        }

        .compare-table tbody td {
            padding: 10px 14px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .compare-table tbody td:first-child {
            text-align: left;
            font-weight: 600;
        }

        .compare-table tbody tr.product-row {
            cursor: pointer;
            transition: background 0.15s;
        }

        .compare-table tbody tr.product-row:hover {
            background: #f9f9fc;
        }

        .compare-table tbody tr.product-row.expanded {
            background: #f0f0fa;
        }

        .compare-table .num-up { color: #e85d6a; font-weight: 600; }
        .compare-table .num-down { color: #3ba272; font-weight: 600; }
        .compare-table .num-zero { color: #aaa; }
        .compare-table .tag-new { color: #fff; background: #e85d6a; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .compare-table .tag-gone { color: #fff; background: #3ba272; padding: 2px 8px; border-radius: 4px; font-size: 11px; }

        .arrow-icon {
            display: inline-block;
            width: 16px;
            text-align: center;
            font-size: 12px;
            color: #999;
            transition: transform 0.2s;
        }

        .product-row.expanded .arrow-icon {
            transform: rotate(90deg);
        }

        /* ===== 明细行 ===== */
        .detail-row td {
            padding: 0 !important;
            border-bottom: 1px solid #e8e8f0 !important;
            background: #fafafe;
        }

        .detail-inner {
            padding: 12px 24px 16px 48px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .detail-table thead th {
            background: #f0f0f8;
            color: #777;
            font-weight: 600;
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid #e0e0e8;
            white-space: nowrap;
        }

        .detail-table thead th:first-child {
            text-align: left;
        }

        .detail-table tbody td {
            padding: 7px 12px;
            text-align: right;
            border-bottom: 1px solid #f0f0f4;
            color: #555;
        }

        .detail-table tbody td:first-child {
            text-align: left;
        }

        .detail-table .domain-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .domain-tag.公域 { background: #fce8ea; color: #e85d6a; }
        .domain-tag.私域 { background: #e6f4ea; color: #3ba272; }

        /* ===== 趋势条 ===== */
        .trend-bar {
            display: inline-block;
            height: 8px;
            border-radius: 4px;
            vertical-align: middle;
            min-width: 2px;
        }

        .trend-bar.up { background: #e85d6a; }
        .trend-bar.down { background: #3ba272; }

        .trend-container {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .control-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>北京移动宽带业务数据对比分析</h1>
    <div style="display:flex;align-items:center;gap:16px;">
        <a href="broadband.html" style="padding:6px 18px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);border-radius:6px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">← 返回看板</a>
        <span class="update-time" id="updateTime"></span>
    </div>
</div>

<!-- ===== 控制面板 ===== -->
<div class="control-panel">
    <div class="control-row">
        <div class="mode-toggle">
            <button id="modeMonth" class="active" onclick="switchMode('month')">按月对比</button>
            <button id="modeDate" onclick="switchMode('date')">自定义日期</button>
            <button id="modeYoy" onclick="switchMode('yoy')">同比对比</button>
        </div>
    </div>

    <!-- 按月模式 -->
    <div class="control-row" id="monthMode">
        <div class="range-group">
            <label>时段A：</label>
            <select id="monthA"></select>
        </div>
        <div class="range-group">
            <label>时段B：</label>
            <select id="monthB"></select>
        </div>
        <button class="btn-compare" onclick="runCompare()">开始对比</button>
    </div>

    <!-- 自定义日期模式 -->
    <div class="control-row hidden" id="dateMode">
        <div class="range-group">
            <label>时段A：</label>
            <input type="date" id="dateAStart">
            <span class="separator">~</span>
            <input type="date" id="dateAEnd">
        </div>
        <div class="range-group">
            <label>时段B：</label>
            <input type="date" id="dateBStart">
            <span class="separator">~</span>
            <input type="date" id="dateBEnd">
        </div>
        <button class="btn-compare" onclick="runCompare()">开始对比</button>
    </div>

    <!-- 同比对比模式 -->
    <div class="control-row hidden" id="yoyMode">
        <div class="range-group">
            <label>对比时段（今年）：</label>
            <input type="date" id="yoyStart">
            <span class="separator">~</span>
            <input type="date" id="yoyEnd">
        </div>
        <span class="yoy-hint">时段A将自动设为去年同期，点击对比即可看同比</span>
        <button class="btn-compare" onclick="runYoYCompare()">开始同比对比</button>
    </div>
</div>

<!-- ===== 汇总信息 ===== -->
<div class="summary-bar" id="summaryBar">
    <div class="summary-item">
        <span class="label">对比范围：</span>
        <span id="summaryRange" style="font-weight:600;color:#333;font-size:14px;">请选择时间范围并点击对比</span>
    </div>
</div>

<!-- ===== 产品单量对比 ===== -->
<div class="table-section">
    <div class="table-title">产品单量对比（按时段B单量排序）</div>
    <table class="compare-table">
        <thead>
            <tr>
                <th>产品名称</th>
                <th>时段A单量</th>
                <th>时段B单量</th>
                <th>差值</th>
                <th>涨跌幅</th>
                <th>趋势</th>
            </tr>
        </thead>
        <tbody id="productTbody"></tbody>
    </table>
</div>

<!-- ===== 业务类型单量对比 ===== -->
<div class="table-section">
    <div class="table-title">业务类型单量对比（宽带新装 / 续费 / 提速，按时段B单量排序，点击业务可展开公域/私域对比）</div>
    <table class="compare-table">
        <thead>
            <tr>
                <th>业务类型</th>
                <th>时段A单量</th>
                <th>时段B单量</th>
                <th>差值</th>
                <th>涨跌幅</th>
                <th>趋势</th>
            </tr>
        </thead>
        <tbody id="bizTbody"></tbody>
    </table>
</div>

<!-- ===== 公私域单量对比 ===== -->
<div class="table-section">
    <div class="table-title">公私域单量对比（点击域可展开查看该域下各产品单量对比）</div>
    <table class="compare-table">
        <thead>
            <tr>
                <th>域 / 产品</th>
                <th>时段A单量</th>
                <th>时段B单量</th>
                <th>差值</th>
                <th>涨跌幅</th>
                <th>趋势</th>
            </tr>
        </thead>
        <tbody id="domainTbody"></tbody>
    </table>
</div>

<script>
// ===== 数据会被嵌入这里 =====
// ${DATA_PLACEHOLDER}

// ===== 全局状态 =====
let currentRangeA = null;
let currentRangeB = null;
let currentCompareResult = null;

// ===== 工具函数 =====
function formatNumber(n) {
    return n.toLocaleString('zh-CN');
}

function formatPct(val) {
    if (val === null) return '';
    const sign = val >= 0 ? '+' : '';
    return sign + val.toFixed(1) + '%';
}

function diffClass(val) {
    if (val > 0) return 'num-up';
    if (val < 0) return 'num-down';
    return 'num-zero';
}

function pctClass(val) {
    if (val === null) return '';
    return val >= 0 ? 'num-up' : 'num-down';
}

// ===== 模式切换 =====
function switchMode(mode) {
    const modes = ['month', 'date', 'yoy'];
    modes.forEach(m => {
        const btn = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        const panel = document.getElementById(m + 'Mode');
        if (m === mode) {
            btn.classList.add('active');
            panel.classList.remove('hidden');
        } else {
            btn.classList.remove('active');
            panel.classList.add('hidden');
        }
    });
}

// ===== 日期范围工具 =====
function getDatesInRange(startDate, endDate) {
    const result = [];
    const start = new Date(startDate);
    const end = new Date(endDate);
    const cur = new Date(start);
    while (cur <= end) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const d = String(cur.getDate()).padStart(2, '0');
        result.push(`${y}-${m}-${d}`);
        cur.setDate(cur.getDate() + 1);
    }
    return result;
}

function getMonthDates(monthKey) {
    const dates = [];
    for (const d of COMPARE_DATA.all_dates) {
        if (d.startsWith(monthKey + '-')) {
            dates.push(d);
        }
    }
    return dates;
}

function datesLabel(dates) {
    if (!dates || dates.length === 0) return '无数据';
    return dates[0] + ' ~ ' + dates[dates.length - 1] + ' (' + dates.length + '天)';
}

// ===== 聚合：产品维度（product_detail: date->product->domain->channel） =====
function aggregateRange(dates) {
    const result = {};
    for (const date of dates) {
        const dayData = COMPARE_DATA.product_detail[date];
        if (!dayData) continue;
        for (const [product, domains] of Object.entries(dayData)) {
            if (!result[product]) result[product] = {};
            for (const [domain, channels] of Object.entries(domains)) {
                if (!result[product][domain]) result[product][domain] = {};
                for (const [channel, count] of Object.entries(channels)) {
                    result[product][domain][channel] = (result[product][domain][channel] || 0) + count;
                }
            }
        }
    }
    return result;
}

function productTotal(aggData, product) {
    if (!aggData[product]) return 0;
    let sum = 0;
    for (const domains of Object.values(aggData[product])) {
        for (const count of Object.values(domains)) {
            sum += count;
        }
    }
    return sum;
}

// ===== 聚合：业务类型维度（biz_detail: date->biz->domain） =====
function aggregateBizRange(dates) {
    const result = {};
    for (const date of dates) {
        const dayData = COMPARE_DATA.biz_detail[date];
        if (!dayData) continue;
        for (const [biz, domains] of Object.entries(dayData)) {
            if (!result[biz]) result[biz] = {};
            for (const [domain, count] of Object.entries(domains)) {
                result[biz][domain] = (result[biz][domain] || 0) + count;
            }
        }
    }
    return result;
}

function bizTotal(aggData, biz) {
    if (!aggData[biz]) return 0;
    let sum = 0;
    for (const v of Object.values(aggData[biz])) sum += v;
    return sum;
}

// ===== 执行对比 =====
function executeCompare(datesA, datesB, labelA, labelB) {
    currentRangeA = { dates: datesA, label: labelA };
    currentRangeB = { dates: datesB, label: labelB };

    const aggA = aggregateRange(datesA);
    const aggB = aggregateRange(datesB);
    const allProducts = new Set([...Object.keys(aggA), ...Object.keys(aggB)]);

    const compareList = [];
    for (const product of allProducts) {
        const totalA = productTotal(aggA, product);
        const totalB = productTotal(aggB, product);
        const diff = totalB - totalA;
        const pct = totalA > 0 ? ((totalB - totalA) / totalA) * 100 : null;

        const details = [];
        const allDomains = new Set([
            ...Object.keys(aggA[product] || {}),
            ...Object.keys(aggB[product] || {})
        ]);
        for (const domain of allDomains) {
            const allChannels = new Set([
                ...Object.keys((aggA[product] || {})[domain] || {}),
                ...Object.keys((aggB[product] || {})[domain] || {})
            ]);
            for (const channel of allChannels) {
                const valA = (aggA[product] || {})[domain]?.[channel] || 0;
                const valB = (aggB[product] || {})[domain]?.[channel] || 0;
                const dDiff = valB - valA;
                const dPct = valA > 0 ? ((valB - valA) / valA) * 100 : null;
                details.push({ domain, channel, valA, valB, diff: dDiff, pct: dPct });
            }
        }
        details.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
        compareList.push({ product, totalA, totalB, diff, pct, details });
    }

    compareList.sort((a, b) => b.totalB - a.totalB);
    currentCompareResult = compareList;

    renderSummary(labelA, labelB, compareList);
    renderProductTable(compareList);
    renderBizTable(datesA, datesB);
    renderDomainTable(aggA, aggB);
}

// ===== 执行对比（按月 / 自定义日期） =====
function runCompare() {
    let datesA, datesB, labelA, labelB;

    if (!document.getElementById('dateMode').classList.contains('hidden')) {
        const aStart = document.getElementById('dateAStart').value;
        const aEnd = document.getElementById('dateAEnd').value;
        const bStart = document.getElementById('dateBStart').value;
        const bEnd = document.getElementById('dateBEnd').value;
        if (!aStart || !aEnd || !bStart || !bEnd) {
            alert('请选择完整的日期范围');
            return;
        }
        if (aStart > aEnd || bStart > bEnd) {
            alert('日期范围有误：起始日期不能晚于结束日期');
            return;
        }
        datesA = getDatesInRange(aStart, aEnd);
        datesB = getDatesInRange(bStart, bEnd);
        labelA = aStart + ' ~ ' + aEnd;
        labelB = bStart + ' ~ ' + bEnd;
    } else {
        const monthA = document.getElementById('monthA').value;
        const monthB = document.getElementById('monthB').value;
        if (!monthA || !monthB) {
            alert('请选择月份');
            return;
        }
        datesA = getMonthDates(monthA);
        datesB = getMonthDates(monthB);
        labelA = monthA.replace('-', '年') + '月';
        labelB = monthB.replace('-', '年') + '月';
    }

    executeCompare(datesA, datesB, labelA, labelB);
}

// ===== 同比对比 =====
function runYoYCompare() {
    const start = document.getElementById('yoyStart').value;
    const end = document.getElementById('yoyEnd').value;
    if (!start || !end) {
        alert('请选择对比时段（今年）');
        return;
    }
    if (start > end) {
        alert('日期范围有误：起始日期不能晚于结束日期');
        return;
    }
    const [sy, sm, sd] = start.split('-').map(Number);
    const [ey, em, ed] = end.split('-').map(Number);
    const aStart = `${sy - 1}-${String(sm).padStart(2, '0')}-${String(sd).padStart(2, '0')}`;
    const aEnd = `${ey - 1}-${String(em).padStart(2, '0')}-${String(ed).padStart(2, '0')}`;

    const datesB = getDatesInRange(start, end);
    const datesA = getDatesInRange(aStart, aEnd);
    const labelB = `${start} ~ ${end}（今年）`;
    const labelA = `${aStart} ~ ${aEnd}（去年）`;

    executeCompare(datesA, datesB, labelA, labelB);
}

// ===== 渲染汇总 =====
function renderSummary(labelA, labelB, list) {
    let totalA = 0, totalB = 0;
    for (const item of list) {
        totalA += item.totalA;
        totalB += item.totalB;
    }
    const totalDiff = totalB - totalA;
    const totalPct = totalA > 0 ? ((totalB - totalA) / totalA) * 100 : null;
    const diffClass = totalDiff >= 0 ? 'up' : 'down';

    document.getElementById('summaryBar').innerHTML = `
        <div class="summary-item">
            <span class="label">对比范围：</span>
            <span style="font-weight:600;color:#333;font-size:14px;">${labelA} → ${labelB}</span>
        </div>
        <div class="summary-item">
            <span class="label">时段A总计：</span>
            <span class="value" style="color:#ff9800;">${formatNumber(totalA)}</span>
        </div>
        <div class="summary-item">
            <span class="label">时段B总计：</span>
            <span class="value" style="color:#ff9800;">${formatNumber(totalB)}</span>
        </div>
        <div class="summary-item">
            <span class="label">差值：</span>
            <span class="value ${diffClass}">${totalDiff >= 0 ? '+' : ''}${formatNumber(totalDiff)}</span>
        </div>
        <div class="summary-item">
            <span class="label">涨跌幅：</span>

        </div>
        <div class="summary-item">
            <span class="label">产品数：</span>

}

        const diffStr = (item.diff >= 0 ? '+' : '') + formatNumber(item.diff);

        const tag = item.totalA === 0 && item.totalB > 0 ? '<span class="tag-new">新增</span>' :
                    item.totalB === 0 && item.totalA > 0 ? '<span class="tag-gone">消失</span>' : '';

// ===== 渲染业务类型对比表格 =====
function renderBizTable(datesA, datesB) {
    const aggA = aggregateBizRange(datesA);
    const aggB = aggregateBizRange(datesB);
    const allBiz = new Set([...Object.keys(aggA), ...Object.keys(aggB)]);

    const list = [];
    for (const biz of allBiz) {
        const a = bizTotal(aggA, biz);
        const b = bizTotal(aggB, biz);
        list.push({ product: biz, totalA: a, totalB: b, diff: b - a, pct: a > 0 ? ((b - a) / a) * 100 : null });
    }
    list.sort((x, y) => y.totalB - x.totalB);

    const tbody = document.getElementById('bizTbody');
    let html = '';
    const maxAbsDiff = list.length > 0 ? Math.max(...list.map(i => Math.abs(i.diff)), 1) : 1;

    for (let i = 0; i < list.length; i++) {
        const item = list[i];
        const diffStr = (item.diff >= 0 ? '+' : '') + formatNumber(item.diff);
        const pctStr = item.pct !== null ? formatPct(item.pct) : '';
        const tag = item.totalA === 0 && item.totalB > 0 ? '<span class="tag-new">新增</span>' :
                    item.totalB === 0 && item.totalA > 0 ? '<span class="tag-gone">消失</span>' : '';
        const barWidth = Math.max(2, (Math.abs(item.diff) / maxAbsDiff) * 100);
        const barClass = item.diff >= 0 ? 'up' : 'down';

        html += `<tr class="product-row" onclick="toggleBizDetail(${i})" id="biz-row-${i}">
            <td><span class="arrow-icon">▶</span> ${item.product}</td>
            <td>${formatNumber(item.totalA)}</td>
            <td>${formatNumber(item.totalB)}</td>
            <td class="${diffClass(item.diff)}">${diffStr}</td>
            <td class="${pctClass(item.pct)}">${pctStr} ${tag}</td>
            <td>
                <div class="trend-container">
                    <div class="trend-bar ${barClass}" style="width:${barWidth}px;"></div>
                </div>
            </td>
        </tr>`;

        // 展开：该业务在公域 / 私域的单量对比
        const domains = ['公域', '私域'];
        let detailHtml = `<table class="detail-table"><thead><tr>
            <th>域</th><th>时段A单量</th><th>时段B单量</th><th>差值</th><th>涨跌幅</th>
        </tr></thead><tbody>`;
        for (const dom of domains) {
            const va = (aggA[item.product] || {})[dom] || 0;
            const vb = (aggB[item.product] || {})[dom] || 0;
            const dDiff = vb - va;
            const dPct = va > 0 ? ((vb - va) / va) * 100 : null;
            const dDiffStr = (dDiff >= 0 ? '+' : '') + formatNumber(dDiff);
            const dPctStr = dPct !== null ? formatPct(dPct) : '';
            detailHtml += `<tr>
                <td><span class="domain-tag ${dom}">${dom}</span></td>
                <td>${formatNumber(va)}</td>
                <td>${formatNumber(vb)}</td>
                <td class="${diffClass(dDiff)}">${dDiffStr}</td>
                <td class="${pctClass(dPct)}">${dPctStr}</td>
            </tr>`;
        }
        detailHtml += '</tbody></table>';

        html += `<tr class="detail-row hidden" id="biz-detail-${i}">
            <td colspan="6"><div class="detail-inner">${detailHtml}</div></td>
        </tr>`;
    }

    tbody.innerHTML = html;
}

// ===== 展开/折叠业务类型明细（公域 / 私域） =====
function toggleBizDetail(index) {
    const detailRow = document.getElementById('biz-detail-' + index);
    const row = document.getElementById('biz-row-' + index);
    if (!detailRow || !row) return;
    const isHidden = detailRow.classList.contains('hidden');

        detailRow.classList.add('hidden');
        row.classList.remove('expanded');
    }
}

// ===== 聚合：某域下各产品单量（agg: product->domain->channel） =====
function extractDomainProducts(agg, domain) {
    const result = {};
    for (const [product, domains] of Object.entries(agg)) {
        if (domains[domain]) {
            let sum = 0;
            for (const count of Object.values(domains[domain])) sum += count;
            if (sum > 0) result[product] = (result[product] || 0) + sum;
        }
    }
    return result;
}

// 构建公域/私域两个域的对比数据
function buildDomainCompare(aggA, aggB) {
    const domains = ['公域', '私域'];
    const sumObj = o => Object.values(o).reduce((s, v) => s + v, 0);
    const out = [];
    for (const dom of domains) {
        const pa = extractDomainProducts(aggA, dom);
        const pb = extractDomainProducts(aggB, dom);
        const allProducts = new Set([...Object.keys(pa), ...Object.keys(pb)]);
        const products = [];
        for (const p of allProducts) {
            const a = pa[p] || 0;
            const b = pb[p] || 0;
            products.push({ product: p, totalA: a, totalB: b, diff: b - a, pct: a > 0 ? ((b - a) / a) * 100 : null });
        }
        products.sort((x, y) => y.totalB - x.totalB);
        const totalA = sumObj(pa);
        const totalB = sumObj(pb);
        out.push({
            domain: dom,
            products,
            totalA,
            totalB,
            diff: totalB - totalA,
            pct: totalA > 0 ? ((totalB - totalA) / totalA) * 100 : null
        });
    }
    return out;
}

// ===== 渲染公私域对比表格（域可展开 -> 各产品） =====
function renderDomainTable(aggA, aggB) {
    const tbody = document.getElementById('domainTbody');
    const domains = buildDomainCompare(aggA, aggB);
    const maxDomDiff = Math.max(1, ...domains.map(d => Math.abs(d.diff)));
    let html = '';

    for (const dom of domains) {
        const safeId = dom.domain === '公域' ? 'gongyu' : 'siyu';
        const domDiffStr = (dom.diff >= 0 ? '+' : '') + formatNumber(dom.diff);
        const domPctStr = dom.pct !== null ? formatPct(dom.pct) : '';
        const domBarWidth = Math.max(2, (Math.abs(dom.diff) / maxDomDiff) * 100);
        const domBarClass = dom.diff >= 0 ? 'up' : 'down';

        html += `<tr class="product-row" onclick="toggleDomainDetail('${dom.domain}')" id="domain-row-${safeId}">
            <td><span class="arrow-icon">▶</span> <span class="domain-tag ${dom.domain}">${dom.domain}</span> 合计</td>
            <td>${formatNumber(dom.totalA)}</td>
            <td>${formatNumber(dom.totalB)}</td>
            <td class="${diffClass(dom.diff)}">${domDiffStr}</td>
            <td class="${pctClass(dom.pct)}">${domPctStr}</td>
            <td><div class="trend-container"><div class="trend-bar ${domBarClass}" style="width:${domBarWidth}px;"></div></div></td>
        </tr>`;

        const maxProdDiff = Math.max(1, ...dom.products.map(p => Math.abs(p.diff)));
        let detailHtml = `<table class="detail-table"><thead><tr>
            <th>产品名称</th><th>时段A单量</th><th>时段B单量</th><th>差值</th><th>涨跌幅</th><th>趋势</th>
        </tr></thead><tbody>`;
        for (const p of dom.products) {
            const diffStr = (p.diff >= 0 ? '+' : '') + formatNumber(p.diff);
            const pctStr = p.pct !== null ? formatPct(p.pct) : '';
            const tag = p.totalA === 0 && p.totalB > 0 ? '<span class="tag-new">新增</span>' :
                        p.totalB === 0 && p.totalA > 0 ? '<span class="tag-gone">消失</span>' : '';
            const barWidth = Math.max(2, (Math.abs(p.diff) / maxProdDiff) * 100);
            const barClass = p.diff >= 0 ? 'up' : 'down';
            detailHtml += `<tr>
                <td>${p.product}</td>
                <td>${formatNumber(p.totalA)}</td>
                <td>${formatNumber(p.totalB)}</td>
                <td class="${diffClass(p.diff)}">${diffStr}</td>
                <td class="${pctClass(p.pct)}">${pctStr} ${tag}</td>
                <td><div class="trend-container"><div class="trend-bar ${barClass}" style="width:${barWidth}px;"></div></div></td>
            </tr>`;
        }
        detailHtml += '</tbody></table>';

        html += `<tr class="detail-row hidden" id="domain-detail-${safeId}">
            <td colspan="6"><div class="detail-inner">${detailHtml}</div></td>
        </tr>`;
    }

    tbody.innerHTML = html;
}

// ===== 初始化 =====
function init() {
    document.getElementById('updateTime').textContent = `数据更新于 ${COMPARE_DATA.generated_at}`;

    const months = COMPARE_DATA.months;
    const opts = months.map(m => `<option value="${m}">${m.replace('-', '年') + '月'}</option>`).join('');
    document.getElementById('monthA').innerHTML = opts;
    document.getElementById('monthB').innerHTML = opts;
    if (months.length >= 2) {
        document.getElementById('monthA').value = months[months.length - 2];
        document.getElementById('monthB').value = months[months.length - 1];
    }

    // 同比模式默认：今年1月1日 ~ 最新日期
    if (months.length > 0) {
        const latest = months[months.length - 1];
        const [ly, lm, ld] = COMPARE_DATA.all_dates[COMPARE_DATA.all_dates.length - 1].split('-').map(Number);
        const curYear = latest.split('-')[0];
        document.getElementById('yoyStart').value = `${curYear}-01-01`;
        document.getElementById('yoyEnd').value = COMPARE_DATA.all_dates[COMPARE_DATA.all_dates.length - 1];
    }

    // 为所有对比模块标题添加折叠箭头（默认展开）
    document.querySelectorAll('.table-section').forEach(function (sec) {
        const title = sec.querySelector('.table-title');
        if (!title) return;
        const arrow = document.createElement('span');
        arrow.className = 'collapse-arrow';
        arrow.innerHTML = '<span class="arrow-icon">▼</span><span class="arrow-text">收起</span>';
        title.appendChild(arrow);
        title.addEventListener('click', function () { toggleSection(sec); });
    });

    runCompare();
}

// 折叠/展开指定模块（点击标题箭头），默认不隐藏
function toggleSection(sec) {
    const collapsed = sec.classList.toggle('collapsed');
    const txt = sec.querySelector('.collapse-arrow .arrow-text');
    if (txt) txt.textContent = collapsed ? '展开' : '收起';
}

document.addEventListener('DOMContentLoaded', init);
